<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #8f7dff 0%, #6ec6ff 100%);
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    padding: 20px;
  }
  .wrap {
    background: rgba(255,255,255,0.92);
    border-radius: 28px;
    padding: 28px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.25);
    text-align: center;
  }
  h1 {
    font-size: 30px;
    color: #6b4dff;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .score-bar {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 12px 0 16px;
  }
  .score-bar div {
    background: #f1edff;
    border-radius: 20px;
    padding: 8px 22px;
    font-size: 16px;
    font-weight: 700;
    color: #5a4ac9;
  }
  .score-bar span { color: #6b4dff; font-size: 20px; margin-left: 6px; }
  canvas {
    display: block;
    margin: 0 auto;
    background: #fdfaff;
    border-radius: 18px;
    border: 3px solid #d9ccff;
    box-shadow: inset 0 0 20px rgba(139,116,255,0.12);
  }
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  button {
    border: none;
    border-radius: 16px;
    padding: 12px 28px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, #8f7dff, #6b4dff);
    box-shadow: 0 6px 14px rgba(107,77,255,0.35);
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(107,77,255,0.45); }
  button:active { transform: translateY(0); }
  #pauseBtn { background: linear-gradient(135deg, #ffb84d, #ff8f4d); box-shadow: 0 6px 14px rgba(255,143,77,0.35); }
  .hint {
    margin-top: 14px;
    font-size: 13px;
    color: #9a92c9;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🐍 贪吃蛇</h1>
    <div class="score-box">
      <div>得分 <span id="score">0</span></div>
      <div>最高分 <span id="best">0</span></div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="controls">
      <button id="restartBtn">重新开始</button>
      <button id="pauseBtn">暂停</button>
    </div>
    <div class="hint">使用键盘方向键 ↑ ↓ ← → 控制移动</div>
  </div>

<script>
  (function(){
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    const GRID = 20;            // 网格数
    const CELL = canvas.width / GRID;  // 每格像素 = 20
    const BASE_SPEED = 160;     // 初始间隔 ms

    let snake, dir, nextDir, food, score, best, loop, paused, over;

    // 从本地存储读取最高分
    try { best = parseInt(localStorage.getItem('snake_best')) || 0; } catch(e){ best = 0; }
    bestEl.textContent = best;

    // 蛇的颜色：糖果渐变
    const headColor = '#ff7eb6';
    const bodyColor = '#ffb36b';
    const foodColor = '#ff5f6d';

    function reset(){
      snake = [
        {x: 9, y: 9},
        {x: 8, y: 9},
        {x: 7, y: 9}
      ];
      dir = {x: 1, y: 0};
      nextDir = dir;
      score = 0;
      speed = BASE_SPEED;
      over = false;
      scoreEl.textContent = score;
      spawnFood();
      draw();
    }

    function spawnFood(){
      while(true){
        const x = Math.floor(Math.random() * GRID);
        const y = Math.floor(Math.random() * GRID);
        if(!snake.some(s => s.x === x && s.y === y)){
          food = {x, y};
          return;
        }
      }
    }

    function draw(){
      // 背景格子
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for(let i=0;i<GRID;i++){
        for(let j=0;j<GRID;j++){
          if((i+j)%2===0){
            ctx.fillStyle = 'rgba(139,116,255,0.05)';
            ctx.fillRect(i*CELL, j*CELL, CELL, CELL);
          }
        }
      }

      // 食物（圆点 + 高光）
      ctx.shadowColor = foodColor;
      ctx.shadowBlur = 12;
      ctx.fillStyle = foodColor;
      ctx.beginPath();
      ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 3, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 蛇身
      for(let i=snake.length-1; i>=0; i--){
        const seg = snake[i];
        const r = CELL/2 - (i===0 ? 2 : 1.5);
        ctx.fillStyle = i===0 ? headColor : bodyColor;
        if(i===0){
          // 眼睛
          ctx.fillStyle = headColor;
          ctx.beginPath();
          ctx.arc(seg.x*CELL + CELL/2, seg.y*CELL + CELL/2, r, 0, Math.PI*2);
          ctx.fill();
          // 眼睛方向
          const eyeOff = 5;
          const ex = seg.x*CELL + CELL/2 + dir.x*eyeOff;
          const ey = seg.y*CELL + CELL/2 + dir.y*eyeOff;
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(ex + dir.y*3, ey + dir.x*3, 3, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#333';
          ctx.beginPath();
          ctx.arc(ex + dir.y*3 + dir.x*1.5, ey + dir.x*3 + dir.y*1.5, 1.6, 0, Math.PI*2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(seg.x*CELL + CELL/2, seg.y*CELL + CELL/2, r, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }

    function step(){
      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

      // 撞墙
      if(head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID){
        return endGame();
      }
      // 撞自己
      if(snake.some(s => s.x === head.x && s.y === head.y)){
        return endGame();
      }

      snake.unshift(head);

      if(head.x === food.x && head.y === food.y){
        score += 10;
        scoreEl.textContent = score;
        spawnFood();
        // 提速
        if(speed > 70) speed -= 4;
      } else {
        snake.pop();
      }
      draw();
    }

    function endGame(){
      over = true;
      clearInterval(loop);
      if(score > best){
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem('snake_best', best); } catch(e){}
      }
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#6b4dff';
      ctx.font = 'bold 30px "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.fillText('游戏结束', canvas.width/2, canvas.height/2 - 10);
      ctx.font = '17px "Microsoft YaHei"';
      ctx.fillStyle = '#5a4ac9';
      ctx.fillText('得分 ' + score, canvas.width/2, canvas.height/2 + 26);
    }

    function start(){
      if(loop) clearInterval(loop);
      loop = setInterval(step, speed);
    }

    function togglePause(){
      if(over) return;
      const btn = document.getElementById('pauseBtn');
      if(loop){
        clearInterval(loop);
        loop = null;
        btn.textContent = '继续';
      } else {
        start();
        btn.textContent = '暂停';
      }
    }

    // 键盘控制
    document.addEventListener('keydown', (e)=>{
      const k = e.key;
      let nd = null;
      if(k === 'ArrowUp' || k === 'w' || k === 'W') nd = {x:0, y:-1};
      else if(k === 'ArrowDown' || k === 's' || k === 'S') nd = {x:0, y:1};
      else if(k === 'ArrowLeft' || k === 'a' || k === 'A') nd = {x:-1, y:0};
      else if(k === 'ArrowRight' || k === 'd' || k === 'D') nd = {x:1, y:0};
      else if(k === ' '){ e.preventDefault(); togglePause(); return; }

      if(nd){
        e.preventDefault();
        // 禁止直接反向
        if(nd.x === -dir.x && nd.y === -dir.y) return;
        nextDir = nd;
      }
    });

    // 按钮
    document.getElementById('restartBtn').addEventListener('click', ()=>{
      reset();
      start();
      document.getElementById('pauseBtn').textContent = '暂停';
    });
    document.getElementById('pauseBtn').addEventListener('click', togglePause);

    reset();
    start();
  })();
</script>
</body>
</html>
